<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <linearGradient id="monochromeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="titlebarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
  </defs>

  <!-- Window Container -->
  <rect x="1" y="1" width="758" height="298" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1"/>
  <rect x="1" y="1" width="758" height="298" rx="12" fill="url(#monochromeGlow)"/>

  <!-- macOS Window Title Bar -->
  <rect x="1" y="1" width="758" height="36" rx="12" fill="url(#titlebarGrad)"/>
  <rect x="1" y="24" width="758" height="13" fill="#121214"/>
  <line x1="1" y1="37" x2="759" y2="37" stroke="#27272a" stroke-width="1"/>

  <circle cx="24" cy="19" r="5" fill="#ff5f56"/>
  <circle cx="42" cy="19" r="5" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="5" fill="#27c93f"/>
  <text x="380" y="23" text-anchor="middle" fill="#a1a1aa" font-size="11.5" letter-spacing="0.5">omar@torbi: ~/profile</text>

  <!-- Terminal Body -->
  <g font-size="14.5">
    <!-- Command Prompt -->
    <text x="28" y="72" fill="#71717a">$ <tspan fill="#ffffff" font-weight="600">whoami</tspan></text>

    <!-- Name & Subtitle -->
    <text x="28" y="102" fill="#fafafa" font-size="21" font-weight="700" letter-spacing="-0.3">Omar Torbi</text>
    <text x="180" y="102" fill="#a1a1aa" font-size="13.5" font-weight="400">full-stack developer / cs student</text>

    <!-- Dividing Hairline -->
    <line x1="28" y1="120" x2="732" y2="120" stroke="#27272a" stroke-width="1"/>

    <!-- Key-Value Metadata -->
    <text x="28" y="148" fill="#71717a">role</text>
    <text x="150" y="148" fill="#fafafa" font-weight="500">Full-Stack Developer · IT Engineer</text>

    <text x="28" y="174" fill="#71717a">focus</text>
    <text x="150" y="174" fill="#fafafa" font-weight="500">Spring Boot · React · Three.js</text>

    <text x="28" y="200" fill="#71717a">school</text>
    <text x="150" y="200" fill="#fafafa" font-weight="500">EMSI Rabat — IIR, Computer Engineering</text>

    <text x="28" y="226" fill="#71717a">based</text>
    <text x="150" y="226" fill="#fafafa" font-weight="500">Rabat / Béni Mellal, Morocco</text>

    <!-- Status Indicator in sleek unified monochrome -->
    <text x="28" y="260" fill="#71717a">status</text>
    <circle cx="158" cy="256" r="4" fill="#fafafa"/>
    <text x="170" y="260" fill="#fafafa" font-weight="500">available for new opportunities</text>
  </g>
</svg>
