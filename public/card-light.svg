<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <linearGradient id="accentLineLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A42F17" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#E35336" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#A42F17" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Window Container with Transparent Background & Clean Terracotta Tinted Border -->
  <rect x="1" y="1" width="758" height="298" rx="12" fill="none" stroke="#E8BAAF" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- macOS Window Title Bar (Subtle Translucent Glass) -->
  <rect x="1" y="1" width="758" height="36" rx="12" fill="rgba(248, 229, 223, 0.45)"/>
  <rect x="1" y="24" width="758" height="13" fill="rgba(242, 215, 207, 0.45)"/>
  <line x1="1" y1="37" x2="759" y2="37" stroke="#E2ABA0" stroke-width="1" stroke-opacity="0.5"/>

  <circle cx="24" cy="19" r="5" fill="#ff5f56"/>
  <circle cx="42" cy="19" r="5" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="5" fill="#27c93f"/>
  <text x="380" y="23" text-anchor="middle" fill="#8C4435" font-size="11.5" letter-spacing="0.5">omar@torbi: ~/profile</text>

  <!-- Terminal Body -->
  <g font-size="14.5">
    <!-- Command Prompt -->
    <text x="28" y="72" fill="#A42F17" font-weight="700">&gt; <tspan fill="#1A1513" font-weight="600">whoami</tspan></text>

    <!-- Name & Subtitle -->
    <text x="28" y="102" fill="#1A1513" font-size="21" font-weight="700" letter-spacing="-0.3">Omar Torbi</text>
    <text x="180" y="102" fill="#A42F17" font-size="13.5" font-weight="600">software &amp; devops engineer</text>

    <!-- Dividing Hairline -->
    <line x1="28" y1="120" x2="732" y2="120" stroke="url(#accentLineLight)" stroke-width="1"/>

    <!-- Key-Value Metadata -->
    <text x="28" y="148" fill="#8C4435" font-weight="600">role</text>
    <text x="150" y="148" fill="#1A1513" font-weight="500">Software &amp; DevOps Engineer</text>

    <text x="28" y="174" fill="#8C4435" font-weight="600">focus</text>
    <text x="150" y="174" fill="#1A1513" font-weight="500">Spring Boot 3 · <tspan fill="#A42F17" font-weight="600">Docker &amp; Linux</tspan> · OCI</text>

    <text x="28" y="200" fill="#8C4435" font-weight="600">school</text>
    <text x="150" y="200" fill="#1A1513" font-weight="500">EMSI Rabat — DDSI, Software Engineering</text>

    <text x="28" y="226" fill="#8C4435" font-weight="600">based</text>
    <text x="150" y="226" fill="#1A1513" font-weight="500">Rabat / Béni Mellal, Morocco</text>

    <!-- Status Indicator in terracotta aura -->
    <text x="28" y="260" fill="#8C4435" font-weight="600">status</text>
    <circle cx="158" cy="256" r="6" fill="#A42F17" fill-opacity="0.18"/>
    <circle cx="158" cy="256" r="3.5" fill="#A42F17"/>
    <text x="172" y="260" fill="#A42F17" font-weight="600">available for pfe internship (feb 2027)</text>
  </g>
</svg>
